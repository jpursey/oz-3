name: CMake

# Pushes to main run CI unless they only change docs. Any other branch, such as
# a pull request's, runs it only when started by hand (Actions > CMake > Run
# workflow), so a PR is checked when it is ready rather than on every push.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# A newer run for the same branch cancels one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# OZ-3 builds against Game Bits' main, checked out beside it, where the root
# CMakeLists.txt finds it. Each platform builds and tests in both Debug and
# Release, as four jobs that run in parallel. One failing doesn't cancel the
# others, so a run shows every configuration that fails.
jobs:
  build-windows:
    name: build-windows-${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - config: debug
          build_type: Debug
        - config: release
          build_type: Release

    steps:
    - uses: actions/checkout@v4
      with:
        path: oz-3

    - uses: actions/checkout@v4
      with:
        repository: jpursey/game-bits
        path: game-bits
        submodules: "recursive"

    # Debug binaries link the debug CRT, which isn't on PATH even after
    # vcvars64, so it is added from the toolset's redist directory and the
    # Windows SDK (ucrtbased.dll). Release doesn't need it, and isn't affected.
    - name: Build and test OZ-3
      shell: cmd
      working-directory: ${{github.workspace}}/oz-3
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
        call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
        for /d %%d in ("%VCToolsRedistDir%debug_nonredist\x64\Microsoft.VC*.DebugCRT") do set "PATH=%%~d;%PATH%"
        set "PATH=%WindowsSdkVerBinPath%x64\ucrt;%PATH%"
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -S . -B out/build/ci || exit /b 1
        cmake --build out/build/ci || exit /b 1
        ctest --test-dir out/build/ci --output-on-failure -j 4 || exit /b 1

  # Linux builds and tests with clang. It is pinned to 24.04 (clang 18), as Game
  # Bits is, since clang 21's new warnings fail Game Bits' build.
  build-linux:
    name: build-linux-${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - config: debug
          build_type: Debug
        - config: release
          build_type: Release

    steps:
    - uses: actions/checkout@v4
      with:
        path: oz-3

    - uses: actions/checkout@v4
      with:
        repository: jpursey/game-bits
        path: game-bits
        submodules: "recursive"

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build and test OZ-3
      working-directory: ${{github.workspace}}/oz-3
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -S . -B out/build/ci
        cmake --build out/build/ci
        ctest --test-dir out/build/ci --output-on-failure -j 4
